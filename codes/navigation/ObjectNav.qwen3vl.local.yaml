task: ObjectNav
agent_cls: ObjectNavAgent
env_cls: ObjectNavEnv

agent_cfg:
  navigability_mode: 'depth_sensor'
  project: true
  pivot: false
  # Keep history bounded to avoid context-length overflows.
  context_history: 0
  explore_bias: 4
  max_action_dist: 1.7
  min_action_dist: 0.5
  clip_frac: 0.66
  stopping_action_dist: 1.5
  default_action: 0.2
  spacing_ratio: 360
  num_theta: 60
  image_edge_threshold: 0.04
  turn_around_cooldown: 3
  navigability_height_threshold: 0.2
  map_scale: 100
  vlm_cfg:
    model_cls: OpenAIVLM
    model_kwargs:
      model: Qwen/Qwen3-VL-8B-Instruct
      max_image_res: 512
      # Match the recorded qwen3-vl-8b VLMNav baseline run.
      image_encode_format: jpeg
      jpeg_quality: 85
      max_images_per_prompt: 2
      use_system_instruction: false
      send_sampling_args: false

sim_cfg:
  agent_height: 1.5
  agent_radius: 0.17
  allow_slide: true
  use_goal_image_agent: false
  sensor_cfg:
    height: 1.5
    pitch: -0.45
    res_factor: 1
    fov: 131

env_cfg:
  num_episodes: 1
  max_steps: 10
  log_freq: 1
  split: val
  success_threshold: 0.3
  instances: 1
  instance: 0
  parallel: false
  name: default
  port: 5000
